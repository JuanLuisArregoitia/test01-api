services:
  - type: web
    name: test01-api
    runtime: php
    plan: free
    buildCommand: >-
      composer install --no-dev --optimize-autoloader &&
      npm install &&
      npm run build &&
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan view:cache
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Test01 API"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: test01-api
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: test01-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: test01-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: test01-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: test01-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: test01-db
          property: password
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "" # set to your frontend domain if using SPA cookies

databases:
  - name: test01-db
    plan: free
    databaseName: test01_api
    user: test01_api_user
